name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job key `check` is a branch-protection contract: it is the required status
  # context for `develop` in .github/settings.yml. Renaming or splitting this job
  # stops that context from being reported, and every pull request then waits on a
  # status that never arrives. Change both files together, or not at all.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tooling
        run: pip install pre-commit -r docs/requirements.txt
      # The remote-include experiment itself is enabled by the checked-in
      # .taskrc.yml; `--yes` accepts the checksum prompt Task raises whenever it
      # resolves an include with no local cache — which is every runner.
      - name: Quality gate
        run: task --yes check
      - name: Docs build (strict)
        run: task --yes docs
