name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Taskfile.yml includes remote taskfiles from nolte/taskfiles;
  # Task gates that experimental feature behind this flag.
  TASK_X_REMOTE_TASKFILES: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tooling
        run: pip install pre-commit -r docs/requirements.txt
      # `--yes` accepts the checksum prompt Task raises the first time it
      # resolves (or re-resolves a changed) remote include.
      - name: Quality gate
        run: task --yes check
      - name: Docs build (strict)
        run: task --yes docs
